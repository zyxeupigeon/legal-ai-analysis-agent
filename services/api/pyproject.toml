[project]
name = "legal-ai-analysis-agent-api"
version = "0.5.0"
description = "P2.3.3 local legal AI claim-evidence and logic-guard Word report test build"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "python-docx==1.2.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["../../tests/unit", "../../tests/integration"]
