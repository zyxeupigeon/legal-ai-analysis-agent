name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace and required files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for path in README.md PROJECT_STRUCTURE.md VERSION_MANIFEST.yaml CHANGELOG.md PROJECT_AGENT_PROTOCOL.md START_AGENT.cmd scripts/create_task_workspace.py scripts/check_agent_workspace.ps1 scripts/self_test_document_pipeline.ps1 docs/PROCESS_OPTIMIZATION_REPORT_TEMPLATE.md; do
            test -f "$path" || { echo "Missing $path"; exit 1; }
          done
          grep -Fq 'project_phase: "P3.2"' VERSION_MANIFEST.yaml
          grep -Fq 'protocol_id: "portable-agent-0.4"' VERSION_MANIFEST.yaml
          grep -Fq 'present_on_main: false' VERSION_MANIFEST.yaml
          test ! -d apps/web
          test ! -d services/api

      - name: Block likely secrets and runtime materials
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env|secrets?|uploads?|downloads?|reports|runtime|logs?)(/|$)|\.(pem|p12|pfx|sqlite3?|dump|backup|log|docx|pdf)$'
          if git ls-files | grep -E "$forbidden" | grep -Ev '(^|/)\.env\.(example|local\.example)$'; then
            echo 'Forbidden secret or runtime material is tracked.'
            exit 1
          fi

      - name: Verify frozen baseline hashes
        run: python scripts/check_baselines.py

  portable-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
